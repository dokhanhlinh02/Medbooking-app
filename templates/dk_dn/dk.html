<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDBOOKING - Đăng ký tài khoản bệnh nhân</title>
    <!-- Favicon hình chú chim cánh cụt y tế -->
    <link rel="icon" type="image/jpeg" href="/static/favicon.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #fdfbfb;
            --text-main: #0f172a;
            --accent-pink: #d64d7a;
            --accent-pink-light: #e8b4b8;
            --border-pink: #f8bbd0;
            --card-bg: rgba(255, 255, 255, 0.85);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-image: url('https://images.unsplash.com/photo-1522383225653-ed111181a951?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center;
            background-attachment: fixed;
            background-color: rgba(255, 240, 245, 0.85);
            background-blend-mode: overlay;
            min-height: 100vh; display: flex; flex-direction: column;
            color: var(--text-main);
            animation: pageFadeIn 0.8s ease-out forwards;
        }

        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- HIỆU ỨNG HOA ANH ĐÀO RƠI --- */
        .petal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999; overflow: hidden;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .petal-overlay.active { opacity: 1; }

        .petal {
            position: absolute; top: -50px; width: 20px; height: 20px;
            background: linear-gradient(135deg, #ffb7c5, #ff8fab);
            border-radius: 150% 0 150% 0; opacity: 0.8;
            animation: fall linear forwards;
            box-shadow: 0 0 5px rgba(255, 183, 197, 0.5);
        }
        .petal:nth-child(odd) {
            border-radius: 0 150% 0 150%;
            background: linear-gradient(135deg, #ffc0cb, #ff69b4);
        }
        .petal:nth-child(3n) {
            width: 15px; height: 15px;
            background: linear-gradient(135deg, #ffd1dc, #ffb6c1);
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0.9; }
            25% { transform: translateY(25vh) rotate(90deg) translateX(30px); }
            50% { transform: translateY(50vh) rotate(180deg) translateX(-20px); }
            75% { transform: translateY(75vh) rotate(270deg) translateX(20px); }
            100% { transform: translateY(110vh) rotate(360deg) translateX(0); opacity: 0; }
        }

        /* =========================================
            HEADER (LOGO MỚI)
            ========================================= */
        .site-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px; background: transparent;
            position: absolute; top: 0; left: 0; right: 0; z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .logo-container:hover {
            transform: scale(1.02);
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--accent-pink), #ff8fab);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 24px;
            box-shadow: 0 5px 20px rgba(214, 77, 122, 0.4);
            position: relative;
            overflow: hidden;
        }

        .logo-icon i {
            animation: heartbeat 1.5s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.15); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
            70% { transform: scale(1); }
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%);
            animation: shine 3s infinite linear;
        }

        @keyframes shine {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .logo-text h1 {
            font-size: 24px;
            color: var(--accent-pink);
            letter-spacing: 1px;
            margin-bottom: -5px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(214, 77, 122, 0.1);
        }

        .logo-text p {
            font-size: 10px;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
            opacity: 0.8;
        }

        .hotline {
            font-size: 14px; color: var(--accent-pink); font-weight: 600;
            background: rgba(255, 255, 255, 0.7); padding: 8px 20px;
            border-radius: 20px; border: 1px solid var(--border-pink);
            backdrop-filter: blur(5px);
        }

        /* --- MAIN CONTAINER --- */
        .register-container {
            flex: 1; display: flex; justify-content: center; align-items: center;
            padding: 100px 20px 40px 20px;
        }

        .register-card {
            background: var(--card-bg); backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 30px;
            width: 100%; max-width: 1000px; display: flex;
            box-shadow: 0 15px 50px rgba(214, 77, 122, 0.15);
            overflow: hidden; position: relative;
        }

        .card-image {
            flex: 0 0 45%; position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .card-image img {
            width: 100%; height: 100%; object-fit: cover;
            mask-image: linear-gradient(to right, black 70%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, black 70%, transparent 100%);
        }

        .register-right-side {
            flex: 1; padding: 50px 60px; display: flex;
            flex-direction: column; justify-content: center; background: transparent;
        }

        .back-home {
            display: inline-block; text-decoration: none; font-size: 12px;
            text-transform: uppercase; letter-spacing: 1.5px; color: #64748b;
            font-weight: 600; margin-bottom: 25px; transition: color 0.3s;
        }
        .back-home:hover { color: var(--accent-pink); }

        .register-right-side h1 {
            font-family: 'Playfair Display', serif; font-size: 34px;
            font-weight: 500; color: var(--text-main); margin-bottom: 16px;
            line-height: 1.2; text-align: center;
        }
        .register-right-side h1 i { color: var(--accent-pink); }

        .register-desc {
            font-size: 14px; color: #475569; margin-bottom: 30px;
            font-weight: 300; line-height: 1.6; text-align: center;
        }

        .form-group { margin-bottom: 18px; }

        .form-group label {
            display: block; font-size: 12px; text-transform: uppercase;
            letter-spacing: 1.2px; font-weight: 600; color: #475569; margin-bottom: 8px;
        }

        .form-group input {
            width: 100%; padding: 15px 20px; border-radius: 50px;
            border: 1px solid #ddd; background: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px;
            color: var(--text-main); outline: none; transition: all 0.3s ease;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
        }
        .form-group input:focus {
            border-color: var(--accent-pink);
            box-shadow: 0 0 0 4px rgba(214, 77, 122, 0.1);
        }

        .btn-submit {
            width: 100%; background: var(--accent-pink-light); color: #ffffff;
            padding: 16px; border-radius: 50px; border: none; font-size: 15px;
            text-transform: uppercase; letter-spacing: 2px; font-weight: 700;
            cursor: pointer; box-shadow: 0 5px 15px rgba(214, 77, 122, 0.2);
            transition: all 0.3s ease; margin-top: 10px; margin-bottom: 25px;
        }
        .btn-submit:hover {
            background: var(--accent-pink); transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(214, 77, 122, 0.3);
        }

        .login-redirect { text-align: center; }
        .login-redirect p { font-size: 14px; color: #64748b; }
        .login-redirect a {
            color: var(--accent-pink); font-weight: 600; text-decoration: none;
            border-bottom: 1px solid var(--accent-pink); padding-bottom: 2px;
            transition: opacity 0.3s;
        }
        .login-redirect a:hover { opacity: 0.7; }

        @media (max-width: 900px) {
            .register-card { flex-direction: column; max-width: 500px; }
            .card-image { height: 200px; flex: none; }
            .card-image img {
                mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
                -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
            }
            .register-right-side { padding: 30px; }
            .site-header { padding: 15px 20px; }
            .hotline { display: none; }
        }
    </style>
</head>
<body>

    <div class="petal-overlay" id="petalOverlay"></div>

    <header class="site-header">
        <div class="logo-container">
            <div class="logo-icon">
                <i class="fa-solid fa-heart-pulse"></i>
            </div>
            <div class="logo-text">
                <h1>MedBooking</h1>
                <p>Chăm sóc sức khỏe toàn diện</p>
            </div>
        </div>
        <div class="hotline">Hotline: 1999 0081</div>
    </header>

    <main class="register-container">
        <div class="register-card">
            <div class="card-image">
                <img src="https://i.pinimg.com/736x/e6/ff/b3/e6ffb314bced137e57aaf5dfeabe968d.jpg" alt="Hoa anh đào MedBooking">
            </div>

            <section class="register-right-side">
                <a href="/dk_dn/home.html" class="back-home transition-link">← Quay lại trang chủ</a>

                <h1>Tạo tài khoản <i>MedBooking</i></h1>
                <p class="register-desc">Điền thông tin bên dưới để tạo hồ sơ số hóa y tế và trải nghiệm dịch vụ đặt lịch khám nhanh chóng.</p>

                <!-- FORM ĐĂNG KÝ -->
                <form id="registerForm">
                    <div class="form-group">
                        <label for="hoten">Họ và tên</label>
                        <input type="text" id="hoten" name="hoten" placeholder="Nhập họ và tên" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Gmail</label>
                        <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Mật khẩu</label>
                        <input type="password" id="password" name="password" placeholder="VD: Abc123 (>=6 ký tự, 1 hoa, 1 số)" required>
                    </div>
                    <button type="submit" class="btn-submit">Chấp nhận</button>
                </form>

                <div class="login-redirect">
                    <p>Đã có tài khoản? <a href="dn.html" class="transition-link">Đăng nhập ngay</a></p>
                </div>
            </section>
        </div>
    </main>

    <!-- SCRIPT HIỆU ỨNG HOA ANH ĐÀO -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const links = document.querySelectorAll('.transition-link');
            const overlay = document.getElementById('petalOverlay');

            function createPetals() {
                overlay.innerHTML = '';
                overlay.classList.add('active');
                for (let i = 0; i < 30; i++) {
                    const petal = document.createElement('div');
                    petal.classList.add('petal');
                    petal.style.left = Math.random() * 100 + '%';
                    const size = Math.random() * 15 + 10;
                    petal.style.width = size + 'px';
                    petal.style.height = size + 'px';
                    const duration = Math.random() * 2 + 2;
                    petal.style.animationDuration = duration + 's';
                    petal.style.animationDelay = Math.random() * 0.5 + 's';
                    petal.style.opacity = Math.random() * 0.5 + 0.5;
                    overlay.appendChild(petal);
                }
            }

            links.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const targetUrl = link.href;
                    createPetals();
                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 1500);
                });
            });
        });
    </script>

    <!-- ========================================== -->
    <!-- SCRIPT XỬ LÝ ĐĂNG KÝ (NHÚNG TRỰC TIẾP) -->
    <!-- ========================================== -->
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Chặn load lại trang

            const fullname = document.getElementById('hoten').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // 1. Kiểm tra ràng buộc mật khẩu
            const passwordRegex = /^(?=.*[A-Z])(?=.*\d).{6,}$/;
            if (!passwordRegex.test(password)) {
                showToast('Mật khẩu phải có ít nhất 6 ký tự, bao gồm 1 chữ hoa và 1 số!', 'error');
                return;
            }

            // 2. Lấy danh sách user từ localStorage
            let users = JSON.parse(localStorage.getItem('medbooking_users')) || [];

            // 3. Kiểm tra email tồn tại
            const existingUser = users.find(u => u.email === email);
            if (existingUser) {
                showToast('Email này đã được đăng ký! Vui lòng đăng nhập.', 'error');
                return;
            }

            // 4. Lưu user mới
            users.push({ fullname, email, password });
            localStorage.setItem('medbooking_users', JSON.stringify(users));

            // 5. Thông báo thành công và chuyển trang
            showToast('Đăng ký thành công! Đang chuyển sang trang đăng nhập...', 'success');

            setTimeout(() => {
                window.location.href = 'dn.html';
            }, 2000);
        });

        // Hàm hiển thị thông báo Toast
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> <span>${message}</span>`;

            Object.assign(toast.style, {
                position: 'fixed', top: '20px', right: '20px',
                background: type === 'success' ? '#4caf50' : '#f44336',
                color: 'white', padding: '15px 25px', borderRadius: '10px',
                boxShadow: '0 5px 15px rgba(0,0,0,0.2)', zIndex: '10000',
                display: 'flex', alignItems: 'center', gap: '10px',
                fontSize: '15px', fontWeight: '500', fontFamily: "'Plus Jakarta Sans', sans-serif"
            });

            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
